<!DOCTYPE html>
<html>
<head>
  <title>Mosaic Stadium Environmental Intelligence</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <script>
    window.APP_CONFIG = {
      airshed: "SK_Riders",
      title: "Mosaic Stadium Environmental Intelligence",
      enableHistory: false,
      timezone: "America/Regina",

      bounds: [[50.25, -105.05], [50.65, -104.20]],
      center: [50.4507, -104.6330],
      zoom: 12,

      currentAQHIUrl:
        "https://raw.githubusercontent.com/DKevinM/SK_datapull/main/data/current_map.geojson",

      currentBlendUrl:
        "https://raw.githubusercontent.com/DKevinM/SK_datapull/main/data/sk_current_blend.geojson",

      forecastUrl:
        "https://raw.githubusercontent.com/DKevinM/SK_datapull/main/data/aqhi_forecasts.geojson",

      purpleAirUrl:
        "https://raw.githubusercontent.com/DKevinM/SK_datapull/main/data/SK_PM25_map.json",

      overlays: [

        "stations",

        "forecast",

        "sk_current",
        "sk_forecast",

        "regina_current",
        "regina_forecast",

        "purpleair",

        "firesmoke_now",
        "firesmoke_6h",
        "firesmoke_12h",
        "firesmoke_24h",

        "weather_radar",
        "weather_wind_u",
        "weather_lightning",
        "weather_thunderstorm"

      ]
    };
  </script>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <script>
  const smokeBounds = [
    [42, -130],
    [65, -90]
  ];
  const smokeLayers = {
    firesmoke_now: L.imageOverlay(
      "https://raw.githubusercontent.com/DKevinM/SK_datapull/main/data/firesmoke_now.png",
      smokeBounds,
      { opacity: 0.55 }
    ),
    firesmoke_6h: L.imageOverlay(
      "https://raw.githubusercontent.com/DKevinM/SK_datapull/main/data/firesmoke_6h.png",
      smokeBounds,
      { opacity: 0.55 }
    ),
    firesmoke_12h: L.imageOverlay(
      "https://raw.githubusercontent.com/DKevinM/SK_datapull/main/data/firesmoke_12h.png",
      smokeBounds,
      { opacity: 0.55 }
    ),
    firesmoke_24h: L.imageOverlay(
      "https://raw.githubusercontent.com/DKevinM/SK_datapull/main/data/firesmoke_24h.png",
      smokeBounds,
      { opacity: 0.55 }
    )
  };

  window.smokeLayers = smokeLayers;

  </script>

</head>
<body>
<div id="modal" class="modal">
  <div class="modal-content">
    <span id="close">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<div id="header">
  <div id="header-left">Mosaic Stadium Environmental Intelligence</div>
  <div id="header-center">Current and forecast air quality, wildfire smoke, and weather conditions for Mosaic Stadium, Regina</div>
  <div id="header-right"></div>
</div>

<div style="position:absolute; top:8px; right:25px; z-index:1000;">
  <input id="addressInput" type="text" placeholder="Enter address..." style="padding:6px; width:250px;" />
  <button onclick="lookupAddress()">Go</button>
</div>

<div id="app">
  <div id="map"></div>
  <div id="panel">
    <div id="aqhi-panel"><div id="aqhi-content"></div></div>
    <div id="station-gauges"></div>
  </div>
</div>

<button onclick="clearSelection()" id="clear-btn">Clear Selection</button>

<script src="js/data.js" defer></script>
<script src="js/aqhi.js" defer></script>
<script src="js/click_utils.js" defer></script>
<script src="js/render.js" defer></script>
<script src="js/map.js" defer></script>
<script src="js/purpleair.js" defer></script>
<script src="js/weather.js" defer></script>
<script src="js/click_engine.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/geocode.js" defer></script>
<script src="js/main.js"></script>

<!-- Mosaic Stadium Enhancements -->
<script>

window.addEventListener("load", () => {

    const stadium = {
        lat: 50.4507,
        lng: -104.6330,
        name: "Mosaic Stadium",
        venue: "Home of the Saskatchewan Roughriders"
    };

    const timer = setInterval(() => {

        if (typeof map === "undefined") return;

        clearInterval(timer);

        const marker = L.marker([stadium.lat, stadium.lng], {

            title: stadium.name

        }).addTo(map);

        marker.bindPopup(
            `<h3 style="margin-bottom:5px;">🏈 ${stadium.name}</h3>
             <b>${stadium.venue}</b><br>
             Environmental Intelligence Monitoring Location`
        );

        const immediateAreaCircle = L.circle([stadium.lat, stadium.lng], {
            radius: 2000,
            color: "#00B050",
            weight: 3,
            fillColor: "#00B050",
            fillOpacity: 0.05
        })
        .addTo(map)
        .bindTooltip("2 km Immediate Stadium Area");

        L.circle([stadium.lat, stadium.lng], {
            radius: 5000,
            color: "#FFC000",
            weight: 2,
            dashArray: "8 8",
            fillOpacity: 0.03
        })
        .addTo(map)
        .bindTooltip("5 km Monitoring Area");

        L.circle([stadium.lat, stadium.lng], {
            radius: 10000,
            color: "#D32F2F",
            weight: 2,
            dashArray: "12 10",
            fillOpacity: 0.02
        })
        .addTo(map)
        .bindTooltip("10 km Regional Intelligence Area");

        map.fitBounds(immediateAreaCircle.getBounds(), {
            padding: [20, 20]
        });

        marker.openPopup();

    }, 100);

});

</script>

</body>
</html>
